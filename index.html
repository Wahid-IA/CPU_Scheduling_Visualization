                                            >
                                                {isPlaying ? <PauseIcon /> : <PlayIcon />}
                                            </button>
                                            <button
                                                onClick={() => { setPlaybackTime(0); setIsPlaying(false); }}
                                                aria-label="Reset timeline"
                                                title="Reset"
                                                className="h-12 w-12 flex items-center justify-center rounded-2xl bg-white text-slate-500 hover:text-slate-700 border border-slate-300 hover:border-slate-400 transition-colors"
                                            >
                                                <ResetIcon />
                                            </button>

                                            <div className="flex-1 min-w-[180px]">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max={totalTime || 1}
                                                    value={playbackTime}
                                                    onChange={(e) => { setPlaybackTime(Number(e.target.value)); setIsPlaying(false); }}
                                                    aria-label="Timeline scrubber"
                                                    className="w-full"
                                                />
                                                <div className="flex justify-between text-[10px] font-mono text-slate-400 mt-0.5 px-0.5">
                                                    <span>0</span><span>{totalTime}</span>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-2 min-w-[150px]">
                                                <span className="text-[10px] font-semibold uppercase tracking-widest text-slate-400">CPU</span>
                                                <div className="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                                                    <div className="h-full rounded-full transition-all duration-500" style={{ width: `${utilization}%`, backgroundColor: theme.color, boxShadow: `0 0 8px ${theme.glow}` }}></div>
                                                </div>
                                                <span className="text-xs font-bold font-mono" style={{ color: theme.color }}>{utilization}%</span>
                                            </div>
                                        </div>

                                        {/* Ready queue */}
                                        <div className="flex flex-wrap items-center gap-2 mb-5 rounded-2xl bg-slate-50 border border-slate-200 px-3.5 py-2.5">
                                            <span className="text-[9px] font-semibold uppercase tracking-widest text-slate-400 mr-1">Ready</span>
                                            {readyState.running && (
                                                <span className="flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-lg" style={{ backgroundColor: `${theme.color}1A`, color: theme.color }}>
                                                    <span className="relative flex h-1.5 w-1.5">
                                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style={{ backgroundColor: theme.color }}></span>
                                                        <span className="relative inline-flex rounded-full h-1.5 w-1.5" style={{ backgroundColor: theme.color }}></span>
                                                    </span>
                                                    RUN {readyState.running.id} · {readyState.running.remaining}ms
                                                </span>
                                            )}
                                            {readyState.runningId === 'IDLE' && (
                                                <span className="text-[11px] text-slate-500 px-2.5 py-1 rounded-lg bg-white border border-slate-200">CPU idle</span>
                                            )}
                                            {readyState.ready.length > 0 ? (
                                                readyState.ready.map(p => {
                                                    const idx = processes.findIndex(x => x.id === p.id);
                                                    return (
                                                        <span key={p.id} className="flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600">
                                                            <span className="h-2 w-2 rounded-full" style={{ backgroundColor: COLOR_HEX[idx % COLOR_HEX.length] }}></span>
                                                            {p.id} · {p.remaining}ms
                                                        </span>
                                                    );
                                                })
                                            ) : (
                                                readyState.runningId !== 'IDLE' && <span className="text-[11px] text-slate-400">queue empty</span>
                                            )}
                                            <span className="ml-auto text-[10px] font-mono text-slate-400">{readyState.completed}/{readyState.total} done</span>
                                        </div>

                                        {/* Gantt */}
                                        {totalTime === 0 ? (
                                            <div className="text-center text-sm text-slate-400 py-10 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                                                Awaiting parameters…
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="relative h-6 mb-1 px-1" aria-hidden="true">
                                                    {Array.from({ length: totalTime + 1 }, (_, t) => (
                                                        <div key={t} className="absolute top-0 bottom-0 flex flex-col items-center" style={{ left: `${(t / totalTime) * 100}%` }}>
                                                            <span className={`${t % rulerStep === 0 ? 'h-2 w-px bg-slate-300' : 'h-1 w-px bg-slate-200'}`}></span>
                                                            {t % rulerStep === 0 && (
                                                                <span className="text-[9px] font-mono text-slate-400 mt-1">{t}</span>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="relative">
                                                    <div className="flex h-20 w-full rounded-2xl overflow-hidden border border-slate-200 relative bg-white">
                                                        {simulation.gantt.map((block, i) => {
                                                            const visibleEnd = Math.max(block.start, Math.min(block.end, playbackTime));
                                                            const widthPct = ((visibleEnd - block.start) / totalTime) * 100;
                                                            if (widthPct <= 0) return null;

                                                            const isIdle = block.id === 'IDLE';
                                                            const processIndex = isIdle ? -1 : processes.findIndex(p => p.id === block.id);
                                                            const colorClass = isIdle ? 'bg-slate-100 text-slate-400 striped-bg' : COLORS[processIndex % COLORS.length];

                                                            return (
                                                                <div
                                                                    key={i}
                                                                    style={{ width: `${widthPct}%` }}
                                                                    className={`${colorClass} h-full flex items-center justify-center border-r border-white/60 relative group transition-all duration-[600ms] ease-linear hover:opacity-90 cursor-help rounded-none`}
                                                                >
                                                                    <div className="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-[10px] py-1 px-2 rounded-lg border border-slate-700 shadow-xl opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none z-20">
                                                                        {block.id} (Time: {block.start} – {block.end})
                                                                    </div>
                                                                    <span className={`font-bold text-sm ${isIdle ? 'text-slate-400' : 'text-white'} truncate px-1 drop-shadow`}>
                                                                        {widthPct > 5 ? block.id : ''}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}

                                                        {playbackTime > 0 && playbackTime < totalTime && (
                                                            <div className="absolute inset-y-0 pointer-events-none" style={{ left: `${(playbackTime / totalTime) * 100}%` }} aria-hidden="true">
                                                                <div className="w-[2px] h-full -translate-x-1/2" style={{ backgroundColor: theme.color, boxShadow: `0 0 8px ${theme.glow}` }}>
                                                                    <div className="absolute -top-[5px] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[5px] border-r-[5px] border-t-[6px] border-l-transparent border-r-transparent" style={{ borderTopColor: theme.color }}></div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Results + the math */}
                                    <div>
                                        <div className="flex items-center gap-3 mb-4">
                                            <StepBadge n={3} />
                                            <div>
                                                <h2 className="text-sm font-bold text-slate-900 leading-tight">Results & the Math</h2>
                                                <p className="text-[11px] text-slate-400">Tap a card to see each calculation</p>
                                            </div>
                                        </div>

                                        <div className="grid md:grid-cols-3 gap-4">
                                            <MetricDrop
                                                icon={<ICONS.trend />}
                                                label="Avg Turnaround Time"
                                                avg={avgTat}
                                                formula="TAT = Completion - Arrival"
                                                rows={metricRows.tat}
                                                open={showTat}
                                                onToggle={() => setShowTat(!showTat)}
                                                theme={theme}
                                            />
                                            <MetricDrop
                                                icon={<ICONS.clock />}
                                                label="Avg Waiting Time"
                                                avg={avgWt}
                                                formula="WT = TAT - Burst"
                                                rows={metricRows.wt}
                                                open={showWt}
                                                onToggle={() => setShowWt(!showWt)}
                                                theme={theme}
                                            />
                                            <MetricDrop
                                                icon={<ICONS.bolt />}
                                                label="Avg Response Time"
                                                avg={avgRt}
                                                formula="RT = First start - Arrival"
                                                rows={metricRows.rt}
                                                open={showRt}
                                                onToggle={() => setShowRt(!showRt)}
                                                theme={theme}
                                            />
                                        </div>
                                    </div>

                                    {/* Event log */}
                                    <div className="rounded-3xl border border-slate-200/70 bg-white shadow-sm p-5">
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-xs font-semibold uppercase tracking-widest text-slate-400">What happened</h3>
                                            <span className="text-[10px] font-mono text-slate-400">{visibleEvents.length} shown · {upcomingCount} upcoming</span>
                                        </div>
                                        {visibleEvents.length === 0 ? (
                                            <div className="text-xs text-slate-400 text-center py-6 bg-slate-50 rounded-2xl">
                                                Rewind the timeline to see scheduling events appear.
                                            </div>
                                        ) : (
                                            <ol className="flex flex-wrap gap-1.5 max-h-[130px] overflow-y-auto slim-scroll pr-1">
                                                {visibleEvents.map((e, idx) => (
                                                    <li
                                                        key={idx}
                                                        className={`flex items-center gap-2 text-[11px] font-mono rounded-lg px-2.5 py-1.5 border ${
                                                            idx === 0 ? 'border-slate-300 bg-slate-50 text-slate-700' : 'border-slate-200 bg-white text-slate-500'
                                                        }`}
                                                    >
                                                        <span className="text-[10px] w-6 flex-shrink-0 text-right" style={{ color: theme.color }}>t={e.time}</span>
                                                        <span className="flex-shrink-0">
                                                            {e.kind === 'idle' && <span className="inline-block h-1.5 w-1.5 rounded-full bg-slate-300"></span>}
                                                            {e.kind === 'start' && <span className="inline-block h-1.5 w-1.5 rounded-full bg-emerald-400"></span>}
                                                            {e.kind === 'resume' && <span className="inline-block h-1.5 w-1.5 rounded-full" style={{ backgroundColor: theme.color }}></span>}
                                                            {e.kind === 'preempt' && <span className="inline-block h-1.5 w-1.5 rounded-full bg-amber-400"></span>}
                                                            {e.kind === 'done' && <span className="inline-block h-1.5 w-1.5 rounded-full bg-emerald-500"></span>}
                                                        </span>
                                                        <span>{e.text}</span>
                                                    </li>
                                                ))}
                                            </ol>
                                        )}
                                    </div>
                                </section>
                            </div>
                        </main>
                    )}

                    {/* ================= DYNAMIC COMPARISON VIEW ================= */}
                    {view === 'compare' && (
                        <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">
                            {/* ===== SECTION 1: DYNAMIC ALGORITHM PICKER & PRESETS ===== */}
                            <section className="rounded-3xl border border-slate-200/70 bg-white shadow-sm p-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-100">
                                    <div>
                                        <div className="flex items-center gap-2.5">
                                            <span className="h-9 w-9 rounded-2xl flex items-center justify-center text-white" style={{ backgroundColor: theme.color, boxShadow: `0 4px 12px ${theme.glow}` }}>
                                                <ICONS.sparkle />
                                            </span>
                                            <div>
                                                <h2 className="text-base font-bold text-slate-900 leading-tight">Dynamic Algorithm Selection</h2>
                                                <p className="text-xs text-slate-400">Choose 2, 3, or more algorithms of your choice to analyze side-by-side</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Selected counter and active processes */}
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-700">
                                            {processes.length} Processes
                                        </span>
                                        <span className="text-xs font-bold px-3 py-1.5 rounded-xl text-white flex items-center gap-1.5" style={{ backgroundColor: theme.color, boxShadow: `0 2px 10px ${theme.glow}` }}>
                                            <span>Comparing {comparedItems.length} Algorithms</span>
                                        </span>
                                    </div>
                                </div>

                                {/* Quick Presets (Choose 2, 3, 4, or All) */}
                                <div className="mt-5">
                                    <div className="flex items-center justify-between mb-2.5">
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Quick Presets:</span>
                                        <span className="text-[11px] text-slate-400">Click any preset or toggle chips below</span>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                                        {COMPARISON_PRESETS.map(preset => {
                                            const isCurrentPreset = preset.keys.length === comparedItems.length &&
                                                preset.keys.every(k => comparedItems.some(i => i.catalogKey === k));
                                            return (
                                                <button
                                                    key={preset.id}
                                                    onClick={() => applyComparisonPreset(preset)}
                                                    className={`px-3 py-2 rounded-xl text-left border transition-all duration-200 group ${
                                                        isCurrentPreset
                                                            ? 'border-indigo-500 bg-indigo-50/60 shadow-sm'
                                                            : 'border-slate-200 bg-slate-50 hover:bg-white hover:border-slate-300'
                                                    }`}
                                                    style={isCurrentPreset ? { borderColor: theme.color, backgroundColor: `${theme.color}0D` } : undefined}
                                                >
                                                    <span className={`block text-xs font-bold truncate ${isCurrentPreset ? 'text-slate-900' : 'text-slate-700'}`}>
                                                        {preset.label}
                                                    </span>
                                                    <span className="block text-[10px] text-slate-400 truncate mt-0.5">{preset.desc}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Multi-Choice Algorithm Selector Chips */}
                                <div className="mt-5 pt-5 border-t border-slate-100">
                                    <div className="flex items-center justify-between mb-3">
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Select Algorithms of Your Choice:</span>
                                        <span className="text-[11px] font-mono text-slate-400">Tip: Click to toggle on/off (min 2 required)</span>
                                    </div>
                                    <div className="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2.5">
                                        {ALGORITHM_CATALOG.map(cat => {
                                            const isSelected = comparedItems.some(item => item.catalogKey === cat.key);
                                            return (
                                                <button
                                                    key={cat.key}
                                                    onClick={() => toggleAlgorithmInComparison(cat)}
                                                    className={`px-3.5 py-3 rounded-2xl border text-left transition-all duration-200 flex flex-col justify-between relative overflow-hidden ${
                                                        isSelected
                                                            ? 'shadow-md border-transparent text-white'
                                                            : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50/70'
                                                    }`}
                                                    style={isSelected ? { backgroundColor: theme.color, boxShadow: `0 4px 14px ${theme.glow}` } : undefined}
                                                >
                                                    <div className="flex items-center justify-between w-full">
                                                        <span className="font-bold text-sm tracking-tight">{cat.name}</span>
                                                        <span className={`h-5 w-5 rounded-full flex items-center justify-center text-xs font-bold ${
                                                            isSelected ? 'bg-white/20 text-white' : 'border border-slate-300 text-transparent'
                                                        }`}>
                                                            {isSelected ? '✓' : ''}
                                                        </span>
                                                    </div>
                                                    <span className={`text-[10px] mt-2 block truncate ${isSelected ? 'text-white/80' : 'text-slate-400'}`}>
                                                        {cat.type}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Custom Variant Add Option (e.g. Compare RR q=2 vs RR q=4) */}
                                <div className="mt-4 pt-3 flex items-center justify-between flex-wrap gap-2 text-xs text-slate-500 bg-slate-50 px-3.5 py-2.5 rounded-2xl border border-slate-200">
                                    <span className="font-medium flex items-center gap-1.5">
                                        <span className="h-2 w-2 rounded-full" style={{ backgroundColor: theme.color }}></span>
                                        Want to test multiple instances? (e.g. Round Robin with different quantums):
                                    </span>
                                    <div className="flex items-center gap-1.5">
                                        <button
                                            onClick={() => addAlgorithmVariant('rr')}
                                            className="px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:border-slate-400 font-semibold text-slate-700 transition-all hover:shadow-sm"
                                        >
                                            + Add Another Round Robin
                                        </button>
                                        <button
                                            onClick={() => addAlgorithmVariant('priority_p')}
                                            className="px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:border-slate-400 font-semibold text-slate-700 transition-all hover:shadow-sm"
                                        >
                                            + Add Preemptive Priority
                                        </button>
                                    </div>
                                </div>
                            </section>

                            {/* ===== SECTION 2: WINNERS & PERFORMANCE INSIGHTS PODIUM ===== */}
                            {dynamicCompareRows.length >= 2 && (
                                <section aria-label="Winner insights" className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {/* Best Waiting Time */}
                                    <div className="rounded-3xl border border-emerald-200 bg-emerald-50/40 p-5 shadow-sm">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-700 flex items-center gap-1.5">
                                                <span className="w-4 h-4"><ICONS.trophy /></span>
                                                Lowest Waiting Time (Winner)
                                            </span>
                                            <span className="text-xs font-mono font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-lg">
                                                {bestWt} ms
                                            </span>
                                        </div>
                                        <p className="text-lg font-bold text-slate-900 leading-tight">
                                            {winnerWt ? winnerWt.label : 'N/A'}
                                            {winnerWt && winnerWt.configLabel ? <span className="text-xs font-normal text-slate-500 ml-1.5">({winnerWt.configLabel})</span> : ''}
                                        </p>
                                        <p className="text-xs text-slate-500 mt-1">
                                            Minimizes total process wait queue time for current arrival burst distribution.
                                        </p>
                                    </div>

                                    {/* Best Turnaround Time */}
                                    <div className="rounded-3xl border border-indigo-200 bg-indigo-50/40 p-5 shadow-sm">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-700 flex items-center gap-1.5">
                                                <span className="w-4 h-4"><ICONS.trend /></span>
                                                Lowest Turnaround Time
                                            </span>
                                            <span className="text-xs font-mono font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-lg">
                                                {bestTat} ms
                                            </span>
                                        </div>
                                        <p className="text-lg font-bold text-slate-900 leading-tight">
                                            {winnerTat ? winnerTat.label : 'N/A'}
                                            {winnerTat && winnerTat.configLabel ? <span className="text-xs font-normal text-slate-500 ml-1.5">({winnerTat.configLabel})</span> : ''}
                                        </p>
                                        <p className="text-xs text-slate-500 mt-1">
                                            Fastest average total cycle time from process arrival to final completion.
                                        </p>
                                    </div>

                                    {/* Best Response Time */}
                                    <div className="rounded-3xl border border-violet-200 bg-violet-50/40 p-5 shadow-sm">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-[11px] font-bold uppercase tracking-wider text-violet-700 flex items-center gap-1.5">
                                                <span className="w-4 h-4"><ICONS.bolt /></span>
                                                Fastest Response Time
                                            </span>
                                            <span className="text-xs font-mono font-bold bg-violet-100 text-violet-800 px-2 py-0.5 rounded-lg">
                                                {bestRt} ms
                                            </span>
                                        </div>
                                        <p className="text-lg font-bold text-slate-900 leading-tight">
                                            {winnerRt ? winnerRt.label : 'N/A'}
                                            {winnerRt && winnerRt.configLabel ? <span className="text-xs font-normal text-slate-500 ml-1.5">({winnerRt.configLabel})</span> : ''}
                                        </p>
                                        <p className="text-xs text-slate-500 mt-1">
                                            Ideal for interactive UI responsiveness; processes begin execution earliest.
                                        </p>
                                    </div>
                                </section>
                            )}

                            {/* ===== SECTION 3: COMPARISON VIEWS (TABLE, VISUAL BARS, TIMELINES) ===== */}
                            <section className="rounded-3xl border border-slate-200/70 bg-white shadow-sm p-6">
                                <div className="flex items-center justify-between gap-4 mb-6 flex-wrap">
                                    <div>
                                        <h3 className="text-sm font-bold text-slate-900">Comparative Analysis Results</h3>
                                        <p className="text-xs text-slate-400">Comparing performance metrics for your {dynamicCompareRows.length} chosen algorithms</p>
                                    </div>

                                    {/* Sub-view switcher */}
                                    <div className="flex gap-1 p-1 rounded-xl bg-slate-100 border border-slate-200 text-xs font-semibold">
                                        <button
                                            onClick={() => setCompareSubView('table')}
                                            className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${
                                                compareSubView === 'table' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                            }`}
                                        >
                                            <span className="w-3.5 h-3.5"><ICONS.table /></span> Table View
                                        </button>
                                        <button
                                            onClick={() => setCompareSubView('bars')}
                                            className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${
                                                compareSubView === 'bars' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                            }`}
                                        >
                                            <span className="w-3.5 h-3.5"><ICONS.bars /></span> Metric Bars
                                        </button>
                                        <button
                                            onClick={() => setCompareSubView('timelines')}
                                            className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${
                                                compareSubView === 'timelines' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                            }`}
                                        >
                                            <span className="w-3.5 h-3.5"><ICONS.layers /></span> Stacked Timelines
                                        </button>
                                    </div>
                                </div>

                                {/* --- SUB-VIEW 1: DETAILED TABLE --- */}
                                {compareSubView === 'table' && (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm">
                                            <thead className="text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200 bg-slate-50/50">
                                                <tr>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Algorithm & Parameters</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Type</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Total Time</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Avg TAT</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Avg WT</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Avg RT</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">CPU Util</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold">Gantt Preview</th>
                                                    <th scope="col" className="px-4 py-3.5 font-semibold text-right">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {dynamicCompareRows.map((r) => {
                                                    const isBestTat = parseFloat(r.avgTat) === bestTat;
                                                    const isBestWt = parseFloat(r.avgWt) === bestWt;
                                                    const isBestRt = parseFloat(r.avgRt) === bestRt;

                                                    return (
                                                        <tr key={r.instanceId} className="hover:bg-slate-50/70 transition-colors">
                                                            <td className="px-4 py-3.5">
                                                                <div className="font-bold text-slate-900">{r.label}</div>
                                                                {/* Quantum inline selector for Round Robin */}
                                                                {r.algoId === 'rr' && (
                                                                    <div className="mt-1 flex items-center gap-1">
                                                                        <span className="text-[10px] text-slate-400">Quantum:</span>
                                                                        {QUANTUM_OPTIONS.map(q => (
                                                                            <button
                                                                                key={q}
                                                                                onClick={() => updateComparisonItemProp(r.instanceId, 'quantum', q)}
                                                                                className={`px-1.5 py-0.5 text-[10px] rounded font-mono font-bold transition-all ${
                                                                                    (r.quantum || 2) === q
                                                                                        ? 'bg-indigo-600 text-white'
                                                                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                                                }`}
                                                                                style={(r.quantum || 2) === q ? { backgroundColor: theme.color } : undefined}
                                                                            >
                                                                                {q}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                                {/* Mode toggle for Priority */}
                                                                {r.algoId === 'priority' && (
                                                                    <div className="mt-1 flex items-center gap-1">
                                                                        <button
                                                                            onClick={() => updateComparisonItemProp(r.instanceId, 'priorityMode', r.priorityMode === 'p' ? 'np' : 'p')}
                                                                            className="text-[10px] px-2 py-0.5 rounded font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200"
                                                                        >
                                                                            Mode: {r.priorityMode === 'p' ? 'Preemptive ⇄ NP' : 'Non-preemptive ⇄ P'}
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3.5">
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                                                                    r.type === 'Preemptive' ? 'bg-violet-100 text-violet-700' : 'bg-sky-100 text-sky-700'
                                                                }`}>
                                                                    {r.type}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3.5 font-mono text-slate-600">{r.total} ms</td>
                                                            <td className={`px-4 py-3.5 font-mono font-bold ${isBestTat ? 'text-emerald-600 bg-emerald-50/50' : 'text-slate-700'}`}>
                                                                <div className="flex items-center gap-1">
                                                                    <span>{r.avgTat}</span>
                                                                    {isBestTat && <span className="text-[10px] bg-emerald-100 text-emerald-800 px-1 rounded font-bold">★ BEST</span>}
                                                                </div>
                                                            </td>
                                                            <td className={`px-4 py-3.5 font-mono font-bold ${isBestWt ? 'text-emerald-600 bg-emerald-50/50' : 'text-slate-700'}`}>
                                                                <div className="flex items-center gap-1">
                                                                    <span>{r.avgWt}</span>
                                                                    {isBestWt && <span className="text-[10px] bg-emerald-100 text-emerald-800 px-1 rounded font-bold">★ BEST</span>}
                                                                </div>
                                                            </td>
                                                            <td className={`px-4 py-3.5 font-mono font-bold ${isBestRt ? 'text-emerald-600 bg-emerald-50/50' : 'text-slate-700'}`}>
                                                                <div className="flex items-center gap-1">
                                                                    <span>{r.avgRt}</span>
                                                                    {isBestRt && <span className="text-[10px] bg-emerald-100 text-emerald-800 px-1 rounded font-bold">★ BEST</span>}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3.5">
                                                                <div className="flex items-center gap-2">
                                                                    <div className="w-12 h-2 rounded-full bg-slate-100 overflow-hidden">
                                                                        <div className="h-full rounded-full" style={{ width: `${r.util}%`, backgroundColor: theme.color }}></div>
                                                                    </div>
                                                                    <span className="text-[11px] font-mono text-slate-500">{r.util}%</span>
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3.5">
                                                                <div className="flex h-3.5 w-40 rounded-full overflow-hidden bg-slate-100 border border-slate-200/50">
                                                                    {r.sim.gantt.map((b, i) => {
                                                                        const w = ((b.end - b.start) / Math.max(1, r.total)) * 100;
                                                                        const isIdle = b.id === 'IDLE';
                                                                        const idx = isIdle ? -1 : processes.findIndex(p => p.id === b.id);
                                                                        return (
                                                                            <div
                                                                                key={i}
                                                                                title={`${b.id}: ${b.start}-${b.end}`}
                                                                                className={isIdle ? 'bg-slate-200' : ''}
                                                                                style={{ width: `${w}%`, backgroundColor: isIdle ? undefined : COLOR_HEX[idx % COLOR_HEX.length] }}
                                                                            ></div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3.5 text-right">
                                                                <div className="flex items-center justify-end gap-1.5">
                                                                    <button
                                                                        onClick={() => switchToSimulatorWithAlgo(r)}
                                                                        title="Load and simulate this algorithm in the timeline player"
                                                                        className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors"
                                                                    >
                                                                        Simulate
                                                                    </button>
                                                                    <button
                                                                        onClick={() => removeComparisonItem(r.instanceId)}
                                                                        disabled={dynamicCompareRows.length <= 2}
                                                                        title={dynamicCompareRows.length <= 2 ? "Minimum 2 algorithms required" : "Remove from comparison"}
                                                                        className="p-1 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 disabled:opacity-30 disabled:hover:text-slate-300 disabled:hover:bg-transparent transition-colors"
                                                                    >
                                                                        <ICONS.trash />
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {/* --- SUB-VIEW 2: VISUAL METRIC COMPARISON BARS --- */}
                                {compareSubView === 'bars' && (
                                    <div className="flex flex-col gap-6 py-2">
                                        {/* Waiting Time Comparison Bars */}
                                        <div className="rounded-2xl border border-slate-200/80 p-5 bg-slate-50/50">
                                            <div className="flex items-center justify-between mb-3">
                                                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                                                    <span className="w-4 h-4 text-emerald-600"><ICONS.clock /></span>
                                                    Average Waiting Time (Lower is Better)
                                                </h4>
                                                <span className="text-xs font-mono text-slate-400">Best: {bestWt} ms</span>
                                            </div>
                                            <div className="flex flex-col gap-2.5">
                                                {dynamicCompareRows.map(r => {
                                                    const val = parseFloat(r.avgWt);
                                                    const pct = Math.max(8, (val / maxWt) * 100);
                                                    const isWinner = val === bestWt;
                                                    return (
                                                        <div key={r.instanceId} className="flex items-center gap-3">
                                                            <div className="w-36 text-xs font-bold text-slate-800 truncate" title={r.label}>
                                                                {r.label}
                                                            </div>
                                                            <div className="flex-1 h-6 rounded-xl bg-slate-200/60 overflow-hidden flex items-center p-0.5">
                                                                <div
                                                                    className={`h-full rounded-lg transition-all duration-500 flex items-center justify-end pr-2 text-[10px] font-bold text-white ${
                                                                        isWinner ? 'bg-emerald-500 shadow-sm' : 'bg-slate-400'
                                                                    }`}
                                                                    style={{ width: `${pct}%`, backgroundColor: isWinner ? undefined : theme.color }}
                                                                >
                                                                    {val} ms
                                                                </div>
                                                            </div>
                                                            <span className="w-16 text-right text-xs font-mono font-bold text-slate-700">
                                                                {val} ms {isWinner && <span className="text-emerald-500">★</span>}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Turnaround Time Comparison Bars */}
                                        <div className="rounded-2xl border border-slate-200/80 p-5 bg-slate-50/50">
                                            <div className="flex items-center justify-between mb-3">
                                                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                                                    <span className="w-4 h-4 text-indigo-600"><ICONS.trend /></span>
                                                    Average Turnaround Time (Lower is Better)
                                                </h4>
                                                <span className="text-xs font-mono text-slate-400">Best: {bestTat} ms</span>
                                            </div>
                                            <div className="flex flex-col gap-2.5">
                                                {dynamicCompareRows.map(r => {
                                                    const val = parseFloat(r.avgTat);
                                                    const pct = Math.max(8, (val / maxTat) * 100);
                                                    const isWinner = val === bestTat;
                                                    return (
                                                        <div key={r.instanceId} className="flex items-center gap-3">
                                                            <div className="w-36 text-xs font-bold text-slate-800 truncate" title={r.label}>
                                                                {r.label}
                                                            </div>
                                                            <div className="flex-1 h-6 rounded-xl bg-slate-200/60 overflow-hidden flex items-center p-0.5">
                                                                <div
                                                                    className={`h-full rounded-lg transition-all duration-500 flex items-center justify-end pr-2 text-[10px] font-bold text-white ${
                                                                        isWinner ? 'bg-emerald-500 shadow-sm' : 'bg-slate-400'
                                                                    }`}
                                                                    style={{ width: `${pct}%`, backgroundColor: isWinner ? undefined : theme.color }}
                                                                >
                                                                    {val} ms
                                                                </div>
                                                            </div>
                                                            <span className="w-16 text-right text-xs font-mono font-bold text-slate-700">
                                                                {val} ms {isWinner && <span className="text-emerald-500">★</span>}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Response Time Comparison Bars */}
                                        <div className="rounded-2xl border border-slate-200/80 p-5 bg-slate-50/50">
                                            <div className="flex items-center justify-between mb-3">
                                                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                                                    <span className="w-4 h-4 text-violet-600"><ICONS.bolt /></span>
                                                    Average Response Time (Lower is Better)
                                                </h4>
                                                <span className="text-xs font-mono text-slate-400">Best: {bestRt} ms</span>
                                            </div>
                                            <div className="flex flex-col gap-2.5">
                                                {dynamicCompareRows.map(r => {
                                                    const val = parseFloat(r.avgRt);
                                                    const pct = Math.max(8, (val / maxRt) * 100);
                                                    const isWinner = val === bestRt;
                                                    return (
                                                        <div key={r.instanceId} className="flex items-center gap-3">
                                                            <div className="w-36 text-xs font-bold text-slate-800 truncate" title={r.label}>
                                                                {r.label}
                                                            </div>
                                                            <div className="flex-1 h-6 rounded-xl bg-slate-200/60 overflow-hidden flex items-center p-0.5">
                                                                <div
                                                                    className={`h-full rounded-lg transition-all duration-500 flex items-center justify-end pr-2 text-[10px] font-bold text-white ${
                                                                        isWinner ? 'bg-emerald-500 shadow-sm' : 'bg-slate-400'
                                                                    }`}
                                                                    style={{ width: `${pct}%`, backgroundColor: isWinner ? undefined : theme.color }}
                                                                >
                                                                    {val} ms
                                                                </div>
                                                            </div>
                                                            <span className="w-16 text-right text-xs font-mono font-bold text-slate-700">
                                                                {val} ms {isWinner && <span className="text-emerald-500">★</span>}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* --- SUB-VIEW 3: STACKED TIMELINES (ALIGNED GANTT) --- */}
                                {compareSubView === 'timelines' && (
                                    <div className="flex flex-col gap-5 py-2">
                                        <p className="text-xs text-slate-500">
                                            All chosen algorithms aligned on the exact same timeline scale (0 to {maxTimelineInCompare} ms) to easily compare context switching, preemption points, and scheduling order.
                                        </p>

                                        {/* Ruler */}
                                        <div className="relative h-6 pl-40 pr-4" aria-hidden="true">
                                            {Array.from({ length: maxTimelineInCompare + 1 }, (_, t) => (
                                                <div key={t} className="absolute top-0 bottom-0 flex flex-col items-center" style={{ left: `calc(160px + ${(t / maxTimelineInCompare) * 100} * (100% - 176px) / 100)` }}>
                                                    <span className={`${t % 2 === 0 ? 'h-2.5 w-px bg-slate-400' : 'h-1.5 w-px bg-slate-200'}`}></span>
                                                    {t % 2 === 0 && <span className="text-[9px] font-mono text-slate-400 mt-1">{t}</span>}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Timelines */}
                                        <div className="flex flex-col gap-3">
                                            {dynamicCompareRows.map(r => (
                                                <div key={r.instanceId} className="flex items-center gap-3">
                                                    <div className="w-40 flex-shrink-0">
                                                        <span className="block text-xs font-bold text-slate-800 truncate">{r.label}</span>
                                                        <span className="block text-[10px] text-slate-400 truncate">Total: {r.total}ms · WT: {r.avgWt}ms</span>
                                                    </div>
                                                    <div className="flex-1 h-9 rounded-xl overflow-hidden border border-slate-200 bg-white flex relative">
                                                        {r.sim.gantt.map((block, i) => {
                                                            const w = ((block.end - block.start) / maxTimelineInCompare) * 100;
                                                            const isIdle = block.id === 'IDLE';
                                                            const pIdx = isIdle ? -1 : processes.findIndex(p => p.id === block.id);
                                                            return (
                                                                <div
                                                                    key={i}
                                                                    style={{ width: `${w}%` }}
                                                                    title={`${block.id}: ${block.start} - ${block.end} ms`}
                                                                    className={`h-full flex items-center justify-center border-r border-white/60 relative group text-xs font-bold text-white transition-opacity hover:opacity-85 ${
                                                                        isIdle ? 'bg-slate-200 text-slate-500 striped-bg' : COLORS[pIdx % COLORS.length]
                                                                    }`}
                                                                >
                                                                    <span className="truncate px-1 drop-shadow text-[11px]">{w > 6 ? block.id : ''}</span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <p className="mt-5 text-[11px] text-slate-400 flex items-center gap-1.5">
                                    <span className="font-bold text-emerald-600">★ BEST</span> marks the optimal performance for that metric among all your selected algorithms.
                                </p>
                            </section>
                        </main>
                    )}

                    {/* ================= FOOTER ================= */}
                    <footer className="max-w-[1400px] mx-auto px-4 sm:px-6 pt-6 text-center text-[11px] text-slate-400">
                        Process Engine — CPU Scheduling Playground with Dynamic Algorithm Comparison. Pick 2, 3, or more algorithms of your choice!
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SchedulingSimulation />);
    </script>
</body>
</html>
