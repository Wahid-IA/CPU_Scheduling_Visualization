<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Engine — CPU Scheduling Playground</title>
    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->

    <!-- PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            background: #f4f5fb;
            color: #334155;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .striped-bg {
            background-image: linear-gradient(45deg, rgba(148,163,184,0.12) 25%, rgba(148,163,184,0.22) 25%, rgba(148,163,184,0.22) 50%, rgba(148,163,184,0.12) 50%, rgba(148,163,184,0.12) 75%, rgba(148,163,184,0.22) 75%, rgba(148,163,184,0.22) 100%);
            background-size: 12px 12px;
        }
        /* Theme-aware range slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary, #6366f1);
            border: 2.5px solid #fff;
            margin-top: -6px;
            box-shadow: 0 1px 5px rgba(15, 23, 42, 0.25);
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 3px;
        }
        input[type=range]::-moz-range-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary, #6366f1);
            border: 2.5px solid #fff;
            box-shadow: 0 1px 5px rgba(15, 23, 42, 0.25);
        }
        input[type=range]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
        }
        input[type=range]:focus-visible {
            outline: 2px solid var(--primary, #6366f1);
            outline-offset: 3px;
            border-radius: 6px;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; appearance: textfield; }
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--primary, #6366f1);
            outline-offset: 2px;
            border-radius: 8px;
        }
        ::selection { background: var(--primary, #6366f1); color: #fff; }
        .slim-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .slim-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ---------------------------------------------------------------
        //  THEMES — user selectable accent colors
        // ---------------------------------------------------------------
        const THEMES = [
            { name: 'Indigo', color: '#6366f1', glow: 'rgba(99,102,241,0.28)' },
            { name: 'Violet', color: '#8b5cf6', glow: 'rgba(139,92,246,0.28)' },
            { name: 'Emerald', color: '#10b981', glow: 'rgba(16,185,129,0.28)' },
            { name: 'Cyan', color: '#0891b2', glow: 'rgba(8,145,178,0.28)' },
            { name: 'Amber', color: '#f59e0b', glow: 'rgba(245,158,11,0.28)' },
            { name: 'Rose', color: '#f43f5e', glow: 'rgba(244,63,94,0.28)' },
        ];

        const algorithms = [
            { id: 'fcfs', name: 'FCFS', desc: 'First come, first served', type: 'Non-preemptive', hasQuantum: false, hasPriority: false },
            { id: 'sjf', name: 'SJF', desc: 'Shortest job first', type: 'Non-preemptive', hasQuantum: false, hasPriority: false },
            { id: 'srtf', name: 'SRTF', desc: 'Shortest remaining time', type: 'Preemptive', hasQuantum: false, hasPriority: false },
            { id: 'rr', name: 'Round Robin', desc: 'Everyone gets a slice', type: 'Preemptive', hasQuantum: true, hasPriority: false },
            { id: 'priority', name: 'Priority', desc: 'Highest priority wins', type: 'Non-preemptive', hasQuantum: false, hasPriority: true },
        ];

        // Dynamic Comparison Catalog
        const ALGORITHM_CATALOG = [
            { key: 'fcfs', algoId: 'fcfs', name: 'FCFS', fullName: 'First Come, First Served', desc: 'Jobs processed in arrival order', type: 'Non-preemptive', hasQuantum: false, hasPriority: false, defaultQuantum: 2, defaultPriorityMode: 'np' },
            { key: 'sjf', algoId: 'sjf', name: 'SJF', fullName: 'Shortest Job First', desc: 'Non-preemptive shortest job first', type: 'Non-preemptive', hasQuantum: false, hasPriority: false, defaultQuantum: 2, defaultPriorityMode: 'np' },
            { key: 'srtf', algoId: 'srtf', name: 'SRTF', fullName: 'Shortest Remaining Time', desc: 'Preemptive shortest job first', type: 'Preemptive', hasQuantum: false, hasPriority: false, defaultQuantum: 2, defaultPriorityMode: 'np' },
            { key: 'rr', algoId: 'rr', name: 'Round Robin', fullName: 'Round Robin', desc: 'Preemptive cyclic time-sliced queue', type: 'Preemptive', hasQuantum: true, hasPriority: false, defaultQuantum: 2, defaultPriorityMode: 'np' },
            { key: 'priority_np', algoId: 'priority', name: 'Priority (NP)', fullName: 'Priority (Non-preemptive)', desc: 'Higher priority finishes before yielding', type: 'Non-preemptive', hasQuantum: false, hasPriority: true, defaultQuantum: 2, defaultPriorityMode: 'np' },
            { key: 'priority_p', algoId: 'priority', name: 'Priority (P)', fullName: 'Priority (Preemptive)', desc: 'Higher priority preempts running job', type: 'Preemptive', hasQuantum: false, hasPriority: true, defaultQuantum: 2, defaultPriorityMode: 'p' },
        ];

        // Comparison quick presets (choose 2, 3, 4, or all)
        const COMPARISON_PRESETS = [
            { id: 'p_2_shortest', label: '2: SJF vs SRTF', desc: 'Shortest Job: Non-preemptive vs Preemptive', keys: ['sjf', 'srtf'] },
            { id: 'p_3_classic', label: '3: FCFS vs SJF vs RR', desc: 'Standard curriculum fundamental three', keys: ['fcfs', 'sjf', 'rr'] },
            { id: 'p_3_preemptive', label: '3: SRTF vs RR vs Priority (P)', desc: 'Preemptive algorithms showdown', keys: ['srtf', 'rr', 'priority_p'] },
            { id: 'p_4_standard', label: '4: FCFS, SJF, SRTF, RR', desc: 'Four primary textbook algorithms', keys: ['fcfs', 'sjf', 'srtf', 'rr'] },
            { id: 'p_all', label: 'All 6 Algorithms', desc: 'Complete comprehensive comparison', keys: ['fcfs', 'sjf', 'srtf', 'rr', 'priority_np', 'priority_p'] },
        ];

        const QUANTUM_OPTIONS = [1, 2, 3, 4, 5];

        const COLORS = [
            'bg-blue-500', 'bg-emerald-500', 'bg-violet-500',
            'bg-amber-500', 'bg-rose-500', 'bg-cyan-500', 'bg-fuchsia-500'
        ];
        const COLOR_HEX = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#f43f5e', '#0891b2', '#d946ef'];

        // ---------------------------------------------------------------
        //  SCHEDULER — pure function usable for both the live sim and compare
        // ---------------------------------------------------------------
        function runScheduler(algoId, processesIn, quantum, priorityMode) {
            let time = 0;
            let gantt = [];
            let procs = processesIn.map(p => ({ ...p, rt: p.bt, endTime: 0 }));
            let done = 0;

            const recordGantt = (id, start, end) => gantt.push({ id, start, end });

            if (algoId === 'fcfs') {
                procs.sort((a, b) => a.at - b.at);
                procs.forEach(p => {
                    if (time < p.at) { recordGantt('IDLE', time, p.at); time = p.at; }
                    recordGantt(p.id, time, time + p.bt);
                    time += p.bt;
                    p.endTime = time;
                });
            } else if (algoId === 'sjf') {
                while (done < procs.length) {
                    let available = procs.filter(p => p.at <= time && p.rt > 0);
                    if (available.length === 0) { recordGantt('IDLE', time, time + 1); time++; continue; }
                    available.sort((a, b) => a.bt - b.bt || a.at - b.at);
                    let p = available[0];
                    recordGantt(p.id, time, time + p.bt);
                    time += p.bt;
                    p.rt = 0;
                    p.endTime = time;
                    done++;
                }
            } else if (algoId === 'srtf') {
                let currentP = null;
                let startT = 0;
                while (done < procs.length) {
                    let available = procs.filter(p => p.at <= time && p.rt > 0);
                    if (available.length === 0) {
                        if (currentP) { recordGantt(currentP.id, startT, time); currentP = null; }
                        recordGantt('IDLE', time, time + 1);
                        time++;
                        continue;
                    }
                    available.sort((a, b) => a.rt - b.rt || a.at - b.at);
                    let nextP = available[0];
                    if (currentP !== nextP) {
                        if (currentP) recordGantt(currentP.id, startT, time);
                        currentP = nextP;
                        startT = time;
                    }
                    currentP.rt--;
                    time++;
                    if (currentP.rt === 0) {
                        recordGantt(currentP.id, startT, time);
                        currentP.endTime = time;
                        currentP = null;
                        done++;
                    }
                }
            } else if (algoId === 'rr') {
                let t = 0;
                let ready = [];
                let inQueue = new Set();
                procs.sort((a, b) => a.at - b.at);
                while (done < procs.length) {
                    procs.forEach(p => {
                        if (p.at <= t && p.rt > 0 && !inQueue.has(p.id)) { ready.push(p); inQueue.add(p.id); }
                    });
                    if (ready.length === 0) { recordGantt('IDLE', t, t + 1); t++; continue; }
                    let p = ready.shift();
                    inQueue.delete(p.id);
                    let runTime = Math.min(p.rt, quantum);
                    recordGantt(p.id, t, t + runTime);
                    t += runTime;
                    p.rt -= runTime;
                    procs.forEach(newP => {
                        if (newP.at <= t && newP.rt > 0 && !inQueue.has(newP.id) && newP.id !== p.id) {
                            ready.push(newP);
                            inQueue.add(newP.id);
                        }
                    });
                    if (p.rt > 0) { ready.push(p); inQueue.add(p.id); }
                    else { p.endTime = t; done++; }
                }
            } else if (algoId === 'priority') {
                if (priorityMode === 'p') {
                    // Preemptive priority — a higher-priority arrival preempts the running process
                    let currentP = null;
                    let startT = 0;
                    while (done < procs.length) {
                        let available = procs.filter(p => p.at <= time && p.rt > 0);
                        if (available.length === 0) {
                            if (currentP) { recordGantt(currentP.id, startT, time); currentP = null; }
                            recordGantt('IDLE', time, time + 1);
                            time++;
                            continue;
                        }
                        available.sort((a, b) => a.priority - b.priority || a.at - b.at);
                        let nextP = available[0];
                        if (currentP !== nextP) {
                            if (currentP) recordGantt(currentP.id, startT, time);
                            currentP = nextP;
                            startT = time;
                        }
                        currentP.rt--;
                        time++;
                        if (currentP.rt === 0) {
                            recordGantt(currentP.id, startT, time);
                            currentP.endTime = time;
                            currentP = null;
                            done++;
                        }
                    }
                } else {
                    // Non-preemptive priority — a running process finishes before yielding
                    while (done < procs.length) {
                        let available = procs.filter(p => p.at <= time && p.rt > 0);
                        if (available.length === 0) { recordGantt('IDLE', time, time + 1); time++; continue; }
                        available.sort((a, b) => a.priority - b.priority || a.at - b.at);
                        let p = available[0];
                        recordGantt(p.id, time, time + p.bt);
                        time += p.bt;
                        p.rt = 0;
                        p.endTime = time;
                        done++;
                    }
                }
            }

            // Merge contiguous blocks
            let merged = [];
            for (let b of gantt) {
                if (merged.length > 0 && merged[merged.length - 1].id === b.id && merged[merged.length - 1].end === b.start) {
                    merged[merged.length - 1].end = b.end;
                } else {
                    merged.push({ ...b });
                }
            }

            // Calculate Response Time (first time a process is scheduled)
            let firstStart = {};
            for (let b of merged) {
                if (b.id !== 'IDLE' && firstStart[b.id] === undefined) firstStart[b.id] = b.start;
            }

            let results = procs.map(p => {
                let tat = p.endTime - p.at;
                let wt = tat - p.bt;
                let firstTime = firstStart[p.id] !== undefined ? firstStart[p.id] : p.at;
                let rt = firstTime - p.at;
                return { ...p, tat, wt, rt };
            });

            return { gantt: merged, results };
        }

        // ---------------------------------------------------------------
        //  METRICS + PDF HELPERS
        // ---------------------------------------------------------------
        function computeMetrics(sim) {
            const n = sim.results.length || 1;
            const avgTat = (sim.results.reduce((a, c) => a + c.tat, 0) / n).toFixed(2);
            const avgWt = (sim.results.reduce((a, c) => a + c.wt, 0) / n).toFixed(2);
            const avgRt = (sim.results.reduce((a, c) => a + c.rt, 0) / n).toFixed(2);
            const total = sim.gantt.length ? sim.gantt[sim.gantt.length - 1].end : 0;
            const busy = sim.gantt.filter(b => b.id !== 'IDLE').reduce((a, b) => a + (b.end - b.start), 0);
            const util = total ? Math.round((busy / total) * 100) : 0;
            return { avgTat, avgWt, avgRt, total, util };
        }

        function parseHex(hex) {
            const h = hex.replace('#', '');
            return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }

        function modeLabel(algo, priorityMode, quantum) {
            let label = algo.name + ' - ' + (algo.id === 'priority'
                ? (priorityMode === 'p' ? 'Preemptive' : 'Non-preemptive')
                : algo.type);
            if (algo.hasQuantum) label += ' - Quantum ' + quantum + ' ms';
            return label;
        }

        function buildReportDoc({ algo, processes, sim, quantum, priorityMode, themeColor }) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const W = doc.internal.pageSize.getWidth();
            const M = 40;

            doc.setFillColor(...parseHex(themeColor));
            doc.rect(0, 0, W, 8, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.setTextColor(20, 24, 40);
            doc.text('Process Engine - Scheduling Report', M, 48);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.setTextColor(100, 110, 130);
            doc.text(modeLabel(algo, priorityMode, quantum) + '    ' + new Date().toLocaleString(), M, 66);

            // 1) Process parameters
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 34, 50);
            doc.text('1. Process Parameters', M, 92);
            doc.autoTable({
                startY: 100,
                head: [['ID', 'Arrival Time', 'Burst Time', 'Priority']],
                body: processes.map(p => [p.id, p.at, p.bt, algo.hasPriority ? p.priority : '-']),
                theme: 'grid',
                headStyles: { fillColor: parseHex(themeColor), textColor: 255, fontSize: 9 },
                bodyStyles: { fontSize: 9, textColor: [40, 45, 60] },
                margin: { left: M, right: M },
            });

            // 2) Gantt chart
            const total = sim.gantt.length ? sim.gantt[sim.gantt.length - 1].end : 0;
            let y = doc.lastAutoTable.finalY + 28;
            if (y > 600) { doc.addPage(); y = 60; }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 34, 50);
            doc.text('2. Gantt Chart', M, y);
            const gStart = M, gEnd = W - M, gH = 30;
            const gY = y + 14;
            if (total > 0) {
                doc.setDrawColor(210, 214, 226);
                doc.setLineWidth(1);
                doc.rect(gStart, gY, gEnd - gStart, gH);
                sim.gantt.forEach(b => {
                    const x = gStart + ((b.start / total) * (gEnd - gStart));
                    const w = ((b.end - b.start) / total) * (gEnd - gStart);
                    if (b.id === 'IDLE') doc.setFillColor(230, 233, 240);
                    else {
                        const idx = processes.findIndex(p => p.id === b.id);
                        doc.setFillColor(...parseHex(COLOR_HEX[idx % COLOR_HEX.length]));
                    }
                    doc.rect(x, gY, Math.max(0, w), gH, 'F');
                    if (w > 14) {
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(8);
                        doc.setTextColor(255, 255, 255);
                        doc.text(b.id, x + w / 2, gY + gH / 2 + 3, { align: 'center' });
                    }
                });
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
                doc.setTextColor(120, 128, 145);
                const step = Math.max(1, Math.ceil(total / 8));
                for (let t = 0; t <= total; t += step) {
                    const x = gStart + ((t / total) * (gEnd - gStart));
                    doc.text(String(t), x, gY + gH + 14, { align: 'center' });
                }
                y = gY + gH + 30;
            }

            // 3) Results & calculations
            if (y > 500) { doc.addPage(); y = 60; }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 34, 50);
            doc.text('3. Results & Calculations', M, y);
            doc.autoTable({
                startY: y + 8,
                head: [['ID', 'Arrival', 'Burst', 'Completion', 'TAT', 'WT', 'RT']],
                body: sim.results.map(p => [p.id, p.at, p.bt, p.endTime, p.tat, p.wt, p.rt]),
                theme: 'grid',
                headStyles: { fillColor: parseHex(themeColor), textColor: 255, fontSize: 9 },
                bodyStyles: { fontSize: 9, textColor: [40, 45, 60] },
                margin: { left: M, right: M },
            });

            // 4) Summary
            let yy = doc.lastAutoTable.finalY + 24;
            if (yy > 700) { doc.addPage(); yy = 60; }
            const m = computeMetrics(sim);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 34, 50);
            doc.text('4. Summary', M, yy);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.setTextColor(60, 66, 84);
            const lines = [
                'Average Turnaround Time (TAT): ' + m.avgTat + ' ms',
                'Average Waiting Time (WT)    : ' + m.avgWt + ' ms',
                'Average Response Time (RT)   : ' + m.avgRt + ' ms',
                'Total Timeline                : ' + m.total + ' ms',
                'CPU Utilization               : ' + m.util + ' %',
                '',
                'Formulas:  TAT = Completion - Arrival',
                '           WT  = TAT - Burst',
                '           RT  = First Start - Arrival',
            ];
            doc.text(lines, M, yy + 18);

            return doc;
        }

        // Dynamic Comparison PDF generator — supports any 2, 3, or more algorithms
        function buildCompareDoc({ processes, compareRows, themeColor }) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const W = doc.internal.pageSize.getWidth();
            const M = 40;

            doc.setFillColor(...parseHex(themeColor));
            doc.rect(0, 0, W, 8, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.setTextColor(20, 24, 40);
            doc.text('Process Engine — Dynamic Algorithm Comparison', M, 48);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.setTextColor(100, 110, 130);
            doc.text(`Comparing ${compareRows.length} Chosen Algorithms | ${processes.length} Processes | ${new Date().toLocaleString()}`, M, 66);

            const best = k => Math.min(...compareRows.map(r => parseFloat(r[k])));
            const bestTat = best('avgTat'), bestWt = best('avgWt'), bestRt = best('avgRt');

            doc.autoTable({
                startY: 85,
                head: [['Algorithm', 'Type', 'Config', 'Total', 'Avg TAT', 'Avg WT', 'Avg RT', 'CPU %']],
                body: compareRows.map(r => [
                    r.label,
                    r.type,
                    r.configLabel || '-',
                    r.total + ' ms',
                    r.avgTat + (parseFloat(r.avgTat) === bestTat ? ' *' : ''),
                    r.avgWt + (parseFloat(r.avgWt) === bestWt ? ' *' : ''),
                    r.avgRt + (parseFloat(r.avgRt) === bestRt ? ' *' : ''),
                    r.util + ' %',
                ]),
                theme: 'grid',
                headStyles: { fillColor: parseHex(themeColor), textColor: 255, fontSize: 9 },
                bodyStyles: { fontSize: 9, textColor: [40, 45, 60] },
                margin: { left: M, right: M },
            });

            // Mini gantt per algorithm
            let y = doc.lastAutoTable.finalY + 28;
            if (y > 600) { doc.addPage(); y = 60; }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 34, 50);
            doc.text('Gantt Charts Comparison (* indicates best metric value)', M, y);
            y += 16;
            const gStart = M + 140, gEnd = W - M, gH = 16;
            compareRows.forEach(r => {
                if (y + gH > 780) { doc.addPage(); y = 60; }
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(8);
                doc.setTextColor(60, 66, 84);
                doc.text(r.label + (r.configLabel ? ` (${r.configLabel})` : ''), M, y + 10);
                if (r.total > 0) {
                    doc.setDrawColor(210, 214, 226);
                    doc.setLineWidth(0.5);
                    doc.rect(gStart, y, gEnd - gStart, gH);
                    r.sim.gantt.forEach(b => {
                        const x = gStart + ((b.start / r.total) * (gEnd - gStart));
                        const w = ((b.end - b.start) / r.total) * (gEnd - gStart);
                        if (b.id === 'IDLE') doc.setFillColor(230, 233, 240);
                        else {
                            const idx = processes.findIndex(p => p.id === b.id);
                            doc.setFillColor(...parseHex(COLOR_HEX[idx % COLOR_HEX.length]));
                        }
                        doc.rect(x, y, Math.max(0, w), gH, 'F');
                        if (w > 12) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(7);
                            doc.setTextColor(255, 255, 255);
                            doc.text(b.id, x + w / 2, y + gH / 2 + 2, { align: 'center' });
                        }
                    });
                }
                y += gH + 10;
            });
            return doc;
        }

        // ---------------------------------------------------------------
        //  ICONS
        // ---------------------------------------------------------------

        // ---------------------------------------------------------------
        //  METRIC DROPDOWN CARD — shows the actual calculation per process
        // ---------------------------------------------------------------
        function MetricDrop({ icon, label, avg, formula, rows, open, onToggle, theme }) {
            return (
                <div className={`bg-white rounded-2xl border shadow-sm transition-all duration-300 ${open ? 'border-slate-300 shadow-md' : 'border-slate-200/70 hover:border-slate-300'}`}>
                    <button
                        onClick={onToggle}
                        aria-expanded={open}
                        className="w-full p-5 flex items-center gap-4 text-left group"
                    >
                        <span className="h-11 w-11 rounded-2xl flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-105" style={{ backgroundColor: `${theme.color}1A`, color: theme.color }}>
                            {icon}
                        </span>
                        <span className="flex-1">
                            <span className="block text-[11px] font-semibold uppercase tracking-widest text-slate-400">{label}</span>
                            <span className="block text-2xl font-bold text-slate-900 mt-0.5">
                                {avg} <span className="text-xs font-medium text-slate-400">ms</span>
                            </span>
                        </span>
                        <ChevronIcon isOpen={open} />
                    </button>
                    {open && (
                        <div className="border-t border-slate-100 p-5">
                            <div className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 font-mono text-xs text-slate-600 mb-4">
                                {formula}
                            </div>
                            <ul className="flex flex-col gap-2">
                                {rows.map((r, i) => (
                                    <li key={i} className="flex items-center gap-2.5 text-sm">
                                        <span className="h-2.5 w-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: r.color }}></span>
                                        <span className="font-mono text-slate-500 flex-1 leading-snug">{r.calc}</span>
                                        <span className="font-mono font-bold text-slate-800 flex-shrink-0">{r.value} ms</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------------
        //  MAIN COMPONENT
        // ---------------------------------------------------------------
        function SchedulingSimulation() {
            const [activeAlgo, setActiveAlgo] = useState(algorithms[0]);
            const [theme, setTheme] = useState(THEMES[0]);
            const [quantum, setQuantum] = useState(2);
            const [priorityMode, setPriorityMode] = useState('np'); // 'np' | 'p'
            const [view, setView] = useState('sim'); // 'sim' | 'compare'
            const [compareSubView, setCompareSubView] = useState('table'); // 'table' | 'bars' | 'timelines'
            const [showTat, setShowTat] = useState(false);
            const [showWt, setShowWt] = useState(false);
            const [showRt, setShowRt] = useState(false);
            const [validationAlert, setValidationAlert] = useState(null);

            const [processes, setProcesses] = useState([
                { id: 'P1', at: 0, bt: 5, priority: 2 },
                { id: 'P2', at: 1, bt: 3, priority: 1 },
                { id: 'P3', at: 2, bt: 8, priority: 4 },
                { id: 'P4', at: 3, bt: 6, priority: 3 },
            ]);

            const [simulation, setSimulation] = useState({ gantt: [], results: [] });

            // Playback interaction
            const [playbackTime, setPlaybackTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const totalTime = simulation.gantt.length ? simulation.gantt[simulation.gantt.length - 1].end : 0;

            // ===============================================================
            //  DYNAMIC ALGORITHM COMPARISON STATE
            //  User can choose 2, 3, 4, 5, 6 or more algorithms dynamically!
            // ===============================================================
            const [comparedItems, setComparedItems] = useState([
                { instanceId: 'cmp_1', catalogKey: 'fcfs', algoId: 'fcfs', name: 'FCFS', type: 'Non-preemptive', quantum: 2, priorityMode: 'np' },
                { instanceId: 'cmp_2', catalogKey: 'sjf', algoId: 'sjf', name: 'SJF', type: 'Non-preemptive', quantum: 2, priorityMode: 'np' },
                { instanceId: 'cmp_3', catalogKey: 'srtf', algoId: 'srtf', name: 'SRTF', type: 'Preemptive', quantum: 2, priorityMode: 'np' },
                { instanceId: 'cmp_4', catalogKey: 'rr', algoId: 'rr', name: 'Round Robin', type: 'Preemptive', quantum: 2, priorityMode: 'np' },
            ]);

            // Run single simulation
            useEffect(() => {
                const sim = runScheduler(activeAlgo.id, processes, quantum, priorityMode);
                setSimulation(sim);
                const newTotal = sim.gantt.length ? sim.gantt[sim.gantt.length - 1].end : 0;
                setPlaybackTime(newTotal);
                setIsPlaying(false);
            }, [processes, activeAlgo, quantum, priorityMode]);

            // Playback Engine
            useEffect(() => {
                let interval;
                if (isPlaying && playbackTime < totalTime) {
                    interval = setInterval(() => {
                        setPlaybackTime(prev => {
                            if (prev >= totalTime) { setIsPlaying(false); return totalTime; }
                            return prev + 1;
                        });
                    }, 600);
                } else if (playbackTime >= totalTime && isPlaying) {
                    setIsPlaying(false);
                }
                return () => clearInterval(interval);
            }, [isPlaying, playbackTime, totalTime]);

            const togglePlay = () => {
                if (playbackTime >= totalTime) setPlaybackTime(0);
                setIsPlaying(!isPlaying);
            };

            const addProcess = () => {
                setProcesses([...processes, { id: `P${processes.length + 1}`, at: 0, bt: 1, priority: 1 }]);
            };

            const randomize = () => {
                setProcesses(processes.map(p => ({
                    ...p,
                    at: Math.floor(Math.random() * 5),
                    bt: 1 + Math.floor(Math.random() * 8),
                    priority: 1 + Math.floor(Math.random() * 5),
                })));
            };

            const resetProcesses = () => {
                setProcesses([
                    { id: 'P1', at: 0, bt: 5, priority: 2 },
                    { id: 'P2', at: 1, bt: 3, priority: 1 },
                    { id: 'P3', at: 2, bt: 8, priority: 4 },
                    { id: 'P4', at: 3, bt: 6, priority: 3 },
                ]);
            };

            const updateProcess = (index, field, value) => {
                const newProcs = [...processes];
                newProcs[index][field] = Math.max(0, parseInt(value) || 0);
                setProcesses(newProcs);
            };

            const removeProcess = (index) => {
                if (processes.length > 1) setProcesses(processes.filter((_, i) => i !== index));
            };

            // ---------------------------------------------------------------
            //  DYNAMIC COMPARISON HANDLERS (Choose 2, 3, or more algorithms)
            // ---------------------------------------------------------------
            const triggerAlert = (msg) => {
                setValidationAlert(msg);
                setTimeout(() => setValidationAlert(null), 3200);
            };

            // Toggle a catalog algorithm in or out of the comparison
            const toggleAlgorithmInComparison = (catalogItem) => {
                const isSelected = comparedItems.some(item => item.catalogKey === catalogItem.key);
                if (isSelected) {
                    if (comparedItems.length <= 2) {
                        triggerAlert('Comparison requires at least 2 algorithms! Please select another before removing this one.');
                        return;
                    }
                    setComparedItems(comparedItems.filter(item => item.catalogKey !== catalogItem.key));
                } else {
                    const newItem = {
                        instanceId: 'cmp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        catalogKey: catalogItem.key,
                        algoId: catalogItem.algoId,
                        name: catalogItem.name,
                        type: catalogItem.type,
                        quantum: catalogItem.defaultQuantum || 2,
                        priorityMode: catalogItem.defaultPriorityMode || 'np',
                    };
                    setComparedItems([...comparedItems, newItem]);
                }
            };

            // Apply a preset (e.g. 2 algorithms, 3 algorithms, 4, or All)
            const applyComparisonPreset = (preset) => {
                const newItems = preset.keys.map((k, idx) => {
                    const cat = ALGORITHM_CATALOG.find(c => c.key === k);
                    return {
                        instanceId: 'cmp_preset_' + idx + '_' + Date.now(),
                        catalogKey: cat.key,
                        algoId: cat.algoId,
                        name: cat.name,
                        type: cat.type,
                        quantum: cat.defaultQuantum || 2,
                        priorityMode: cat.defaultPriorityMode || 'np',
                    };
                });
                setComparedItems(newItems);
            };

            // Remove a specific row/item from comparison
            const removeComparisonItem = (instanceId) => {
                if (comparedItems.length <= 2) {
                    triggerAlert('Comparison requires at least 2 algorithms! You cannot remove more.');
                    return;
                }
                setComparedItems(comparedItems.filter(item => item.instanceId !== instanceId));
            };

            // Update item property (e.g. quantum or priority mode directly inside comparison)
            const updateComparisonItemProp = (instanceId, field, value) => {
                setComparedItems(comparedItems.map(item => {
                    if (item.instanceId === instanceId) {
                        return { ...item, [field]: value };
                    }
                    return item;
                }));
            };

            // Add duplicate / variant algorithm (e.g. Round Robin with another quantum)
            const addAlgorithmVariant = (catalogKey) => {
                const cat = ALGORITHM_CATALOG.find(c => c.key === catalogKey) || ALGORITHM_CATALOG[0];
                const countOfThis = comparedItems.filter(i => i.catalogKey === catalogKey).length;
                const newItem = {
                    instanceId: 'cmp_var_' + Date.now(),
                    catalogKey: cat.key,
                    algoId: cat.algoId,
                    name: `${cat.name}${countOfThis > 0 ? ` (Var ${countOfThis + 1})` : ''}`,
                    type: cat.type,
                    quantum: cat.hasQuantum ? (countOfThis === 1 ? 4 : 3) : (cat.defaultQuantum || 2),
                    priorityMode: cat.defaultPriorityMode || 'np',
                };
                setComparedItems([...comparedItems, newItem]);
            };

            // Switch to simulator view and load that exact algorithm
            const switchToSimulatorWithAlgo = (item) => {
                const matchAlgo = algorithms.find(a => a.id === item.algoId) || algorithms[0];
                setActiveAlgo(matchAlgo);
                if (item.quantum) setQuantum(item.quantum);
                if (item.priorityMode) setPriorityMode(item.priorityMode);
                setView('sim');
            };

            // ---------------------------------------------------------------
            //  DERIVED METRICS & RESULTS
            // ---------------------------------------------------------------
            const numProcs = simulation.results.length || 1;
            const avgTat = (simulation.results.reduce((a, c) => a + c.tat, 0) / numProcs).toFixed(2);
            const avgWt = (simulation.results.reduce((a, c) => a + c.wt, 0) / numProcs).toFixed(2);
            const avgRt = (simulation.results.reduce((a, c) => a + c.rt, 0) / numProcs).toFixed(2);

            const busyTime = simulation.gantt.filter(b => b.id !== 'IDLE').reduce((a, b) => a + (b.end - b.start), 0);
            const utilization = totalTime ? Math.round((busyTime / totalTime) * 100) : 0;
            const throughput = totalTime ? (simulation.results.length / totalTime).toFixed(3) : '0';

            const displayType = activeAlgo.id === 'priority'
                ? (priorityMode === 'p' ? 'Preemptive' : 'Non-preemptive')
                : activeAlgo.type;

            const activeBlock = simulation.gantt.find(b => playbackTime > b.start && playbackTime <= b.end);
            const currentlyActiveProcessId = activeBlock ? activeBlock.id : null;

            // Ready queue snapshot at the current playback time
            const readyState = (() => {
                const t = playbackTime;
                const running = simulation.gantt.find(b => t > b.start && t <= b.end);
                const runningId = running ? running.id : null;
                const executed = {};
                simulation.gantt.forEach(b => {
                    if (b.id === 'IDLE') return;
                    const overlap = Math.max(0, Math.min(b.end, t) - b.start);
                    executed[b.id] = (executed[b.id] || 0) + overlap;
                });
                const states = simulation.results.map(p => ({
                    id: p.id,
                    remaining: Math.max(0, p.bt - (executed[p.id] || 0)),
                    arrived: p.at <= t,
                }));
                return {
                    runningId,
                    running: runningId && runningId !== 'IDLE' ? states.find(s => s.id === runningId) : null,
                    ready: states.filter(s => s.arrived && s.remaining > 0 && s.id !== runningId),
                    completed: states.filter(s => s.arrived && s.remaining === 0).length,
                    total: states.length,
                };
            })();

            // Event log derived from gantt blocks
            let events = [];
            {
                let seenFirst = {};
                simulation.gantt.forEach((b, i) => {
                    if (b.id === 'IDLE') {
                        events.push({ time: b.start, kind: 'idle', text: 'CPU idle' });
                    } else {
                        const isFirst = seenFirst[b.id] === undefined;
                        if (isFirst) seenFirst[b.id] = true;
                        const hasLater = simulation.gantt.slice(i + 1).some(x => x.id === b.id);
                        events.push({ time: b.start, kind: isFirst ? 'start' : 'resume', text: isFirst ? `${b.id} started` : `${b.id} resumed` });
                        events.push({ time: b.end, kind: hasLater ? 'preempt' : 'done', text: hasLater ? `${b.id} preempted` : `${b.id} completed` });
                    }
                });
                events.sort((a, b) => a.time - b.time);
            }
            const visibleEvents = events.filter(e => e.time <= playbackTime).reverse();
            const upcomingCount = events.filter(e => e.time > playbackTime).length;

            // Metric dropdown data (shows the math)
            const metricRows = {
                tat: simulation.results.map((p, i) => ({
                    color: COLOR_HEX[i % COLOR_HEX.length],
                    calc: `${p.id}: Completion(${p.endTime}) - Arrival(${p.at})`,
                    value: p.tat,
                })),
                wt: simulation.results.map((p, i) => ({
                    color: COLOR_HEX[i % COLOR_HEX.length],
                    calc: `${p.id}: TAT(${p.tat}) - Burst(${p.bt})`,
                    value: p.wt,
                })),
                rt: simulation.results.map((p, i) => ({
                    color: COLOR_HEX[i % COLOR_HEX.length],
                    calc: `${p.id}: First start(${p.at + p.rt}) - Arrival(${p.at})`,
                    value: p.rt,
                })),
            };

            // ===============================================================
            //  DYNAMIC COMPARISON ROWS CALCULATION
            // ===============================================================
            const dynamicCompareRows = useMemo(() => {
                return comparedItems.map(item => {
                    const sim = runScheduler(item.algoId, processes, item.quantum || quantum, item.priorityMode || priorityMode);
                    const metrics = computeMetrics(sim);
                    let configLabel = '';
                    if (item.algoId === 'rr') configLabel = `q=${item.quantum || 2}ms`;
                    else if (item.algoId === 'priority') configLabel = item.priorityMode === 'p' ? 'Preemptive' : 'Non-preemptive';

                    return {
                        ...item,
                        label: item.name,
                        configLabel,
                        sim,
                        ...metrics,
                    };
                });
            }, [comparedItems, processes, quantum, priorityMode]);

            const bestTat = Math.min(...dynamicCompareRows.map(r => parseFloat(r.avgTat)));
            const bestWt = Math.min(...dynamicCompareRows.map(r => parseFloat(r.avgWt)));
            const bestRt = Math.min(...dynamicCompareRows.map(r => parseFloat(r.avgRt)));

            // Identify best algorithm winners
            const winnerWt = dynamicCompareRows.find(r => parseFloat(r.avgWt) === bestWt);
            const winnerTat = dynamicCompareRows.find(r => parseFloat(r.avgTat) === bestTat);
            const winnerRt = dynamicCompareRows.find(r => parseFloat(r.avgRt) === bestRt);

            // Maximum values for comparative bar scaling
            const maxTat = Math.max(...dynamicCompareRows.map(r => parseFloat(r.avgTat)), 1);
            const maxWt = Math.max(...dynamicCompareRows.map(r => parseFloat(r.avgWt)), 1);
            const maxRt = Math.max(...dynamicCompareRows.map(r => parseFloat(r.avgRt)), 1);
            const maxTimelineInCompare = Math.max(...dynamicCompareRows.map(r => r.total), 1);

            const rulerStep = totalTime <= 12 ? 1 : Math.ceil(totalTime / 12);

            const handleExport = () => {
                if (!window.jspdf) { alert('PDF library not loaded yet. Check your connection and reload.'); return; }
                const doc = view === 'compare'
                    ? buildCompareDoc({ processes, compareRows: dynamicCompareRows, themeColor: theme.color })
                    : buildReportDoc({ algo: activeAlgo, processes, sim: simulation, quantum, priorityMode, themeColor: theme.color });
                doc.save(view === 'compare' ? `ProcessEngine-Comparison-${dynamicCompareRows.length}Algos.pdf` : `ProcessEngine-${activeAlgo.name}.pdf`);
            };

            const StepBadge = ({ n }) => (
                <span className="h-7 w-7 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0" style={{ backgroundColor: theme.color, boxShadow: `0 2px 10px ${theme.glow}` }}>
                    {n}
                </span>
            );

            // ---------------------------------------------------------------
            //  RENDER
            // ---------------------------------------------------------------
            return (
                <div className="min-h-screen text-slate-700 pb-12" style={{ '--primary': theme.color, '--primary-glow': theme.glow }}>
                    {/* Soft ambient blobs */}
                    <div className="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
                        <div className="absolute -top-40 left-1/4 h-[420px] w-[520px] rounded-full opacity-[0.14] blur-[110px] transition-colors duration-700" style={{ backgroundColor: theme.color }}></div>
                        <div className="absolute bottom-0 right-0 h-[320px] w-[420px] rounded-full opacity-[0.10] blur-[100px] transition-colors duration-700" style={{ backgroundColor: theme.color }}></div>
                    </div>

                    {/* Toast Notification Alert */}
                    {validationAlert && (
                        <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2 animate-bounce">
                            <span className="h-2 w-2 rounded-full bg-amber-400"></span>
                            {validationAlert}
                        </div>
                    )}

                    {/* ================= NAVBAR ================= */}
                    <header className="sticky top-0 z-40 backdrop-blur-xl bg-white/80 border-b border-slate-200/70">
                        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-3 flex items-center gap-4 flex-wrap">
                            <div className="flex items-center gap-3 mr-auto">
                                <div
                                    className="h-10 w-10 rounded-2xl flex items-center justify-center text-white"
                                    style={{ background: `linear-gradient(135deg, ${theme.color}, ${theme.color}99)`, boxShadow: `0 4px 16px ${theme.glow}` }}
                                    aria-hidden="true"
                                >
                                    <ICONS.cpu />
                                </div>
                                <div className="leading-tight">
                                    <h1 className="text-base font-bold text-slate-900 tracking-tight">Process Engine</h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-widest font-medium">CPU Scheduling Playground</p>
                                </div>
                            </div>

                            {/* View tabs */}
                            <div className="flex gap-1 p-1 rounded-2xl bg-slate-100 border border-slate-200/70" role="tablist" aria-label="App view">
                                <button
                                    role="tab"
                                    aria-selected={view === 'sim'}
                                    onClick={() => setView('sim')}
                                    className={`px-4 py-1.5 rounded-xl text-xs font-semibold transition-all ${view === 'sim' ? 'text-white' : 'text-slate-500 hover:text-slate-700'}`}
                                    style={view === 'sim' ? { backgroundColor: theme.color, boxShadow: `0 2px 10px ${theme.glow}` } : undefined}
                                >
                                    Simulator
                                </button>
                                <button
                                    role="tab"
                                    aria-selected={view === 'compare'}
                                    onClick={() => setView('compare')}
                                    className={`px-4 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 ${view === 'compare' ? 'text-white' : 'text-slate-500 hover:text-slate-700'}`}
                                    style={view === 'compare' ? { backgroundColor: theme.color, boxShadow: `0 2px 10px ${theme.glow}` } : undefined}
                                >
                                    <span>Compare</span>
                                    <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${view === 'compare' ? 'bg-white/25 text-white' : 'bg-slate-200 text-slate-600'}`}>
                                        {comparedItems.length}
                                    </span>
                                </button>
                            </div>

                            {/* Theme swatches */}
                            <div className="flex items-center gap-1.5" role="radiogroup" aria-label="Accent theme">
                                {THEMES.map((t) => {
                                    const active = theme.name === t.name;
                                    return (
                                        <button
                                            key={t.name}
                                            role="radio"
                                            aria-checked={active}
                                            aria-label={`${t.name} theme`}
                                            title={t.name}
                                            onClick={() => setTheme(t)}
                                            className={`h-7 w-7 rounded-full flex items-center justify-center transition-all duration-200 hover:scale-110 ${
                                                active ? 'ring-2 ring-white ring-offset-2 ring-offset-white scale-105' : 'ring-1 ring-slate-300 hover:ring-slate-400'
                                            }`}
                                            style={{ backgroundColor: t.color, boxShadow: active ? `0 0 14px ${t.glow}` : undefined }}
                                        >
                                            {active && <CheckIcon />}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Export */}
                            <button
                                onClick={handleExport}
                                className="flex items-center gap-1.5 text-xs font-semibold text-white px-3.5 py-2 rounded-xl transition-all hover:scale-[1.03] active:scale-95"
                                style={{ backgroundColor: theme.color, boxShadow: `0 4px 16px ${theme.glow}` }}
                            >
                                <span className="w-4 h-4"><ICONS.download /></span>
                                Export PDF
                            </button>
                        </div>
                    </header>

                    {/* ================= SIMULATOR VIEW ================= */}
                    {view === 'sim' && (
                        <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
                            {/* ===== STATS STRIP ===== */}
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                                {[
                                    { label: 'CPU Utilization', value: utilization, suffix: '%', icon: <ICONS.cpu /> },
                                    { label: 'Throughput', value: throughput, suffix: ' proc/ms', icon: <ICONS.gauge /> },
                                    { label: 'Avg TAT', value: avgTat, suffix: ' ms', icon: <ICONS.trend /> },
                                    { label: 'Avg WT', value: avgWt, suffix: ' ms', icon: <ICONS.clock /> },
                                    { label: 'Avg RT', value: avgRt, suffix: ' ms', icon: <ICONS.bolt /> },
                                ].map(s => (
                                    <div key={s.label} className="rounded-2xl border border-slate-200/70 bg-white shadow-sm p-4 flex items-center gap-3">
                                        <span className="h-10 w-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ backgroundColor: `${theme.color}1A`, color: theme.color }}>
                                            {s.icon}
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold uppercase tracking-widest text-slate-400 truncate">{s.label}</p>
                                            <p className="text-lg font-bold text-slate-900 leading-tight truncate">
                                                {s.value}<span className="text-[10px] font-medium text-slate-400">{s.suffix}</span>
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="grid lg:grid-cols-[380px_1fr] gap-6">
                                {/* -------- LEFT: PROCESS SETUP -------- */}
                                <section className="flex flex-col gap-6" aria-label="Process configuration">
                                    {/* Algorithm picker */}
                                    <div className="rounded-3xl border border-slate-200/70 bg-white shadow-sm overflow-hidden">
                                        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                                            <div>
                                                <h2 className="text-sm font-bold text-slate-900 leading-tight">Pick an Algorithm</h2>
                                                <p className="text-[11px] text-slate-400">How should the CPU decide what runs next?</p>
                                            </div>
                                            <button
                                                onClick={() => setView('compare')}
                                                className="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 transition-colors flex items-center gap-1"
                                                style={{ color: theme.color }}
                                            >
                                                Compare Mode <ICONS.arrowRight />
                                            </button>
                                        </div>
                                        <div className="p-3 flex flex-col gap-2">
                                            {algorithms.map((algo) => {
                                                const active = activeAlgo.id === algo.id;
                                                const rowType = algo.id === 'priority' ? displayType : algo.type;
                                                return (
                                                    <div key={algo.id}>
                                                        <button
                                                            onClick={() => setActiveAlgo(algo)}
                                                            aria-pressed={active}
                                                            className={`w-full text-left px-4 py-3 rounded-2xl transition-all duration-200 text-sm flex items-center gap-3 ${
                                                                active
                                                                    ? 'text-white shadow-md'
                                                                    : 'bg-slate-50 border border-slate-200/70 text-slate-600 hover:border-slate-300 hover:bg-white'
                                                            }`}
                                                            style={active ? { backgroundColor: theme.color, boxShadow: `0 6px 18px ${theme.glow}` } : undefined}
                                                        >
                                                            <span className="flex-1 min-w-0">
                                                                <span className="block font-bold leading-tight">{algo.name}</span>
                                                                <span className={`block text-[11px] truncate ${active ? 'text-white/75' : 'text-slate-400'}`}>{algo.desc}</span>
                                                            </span>
                                                            <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider flex-shrink-0 ${active ? 'bg-white/20 text-white' : 'bg-white text-slate-500 border border-slate-200'}`}>
                                                                {rowType}
                                                            </span>
                                                        </button>
                                                        {algo.id === 'priority' && (
                                                            <div className="mt-2 grid grid-cols-2 gap-2 pl-4" role="radiogroup" aria-label="Priority preemption mode">
                                                                {[
                                                                    { id: 'p', label: 'Preemptive' },
                                                                    { id: 'np', label: 'Non-preemptive' },
                                                                ].map(m => {
                                                                    const mActive = active && priorityMode === m.id;
                                                                    return (
                                                                        <button
                                                                            key={m.id}
                                                                            role="radio"
                                                                            aria-checked={mActive}
                                                                            onClick={() => { setActiveAlgo(algo); setPriorityMode(m.id); }}
                                                                            className={`text-[11px] font-semibold px-3 py-1.5 rounded-xl transition-all ${
                                                                                mActive
                                                                                    ? 'text-white'
                                                                                    : 'bg-slate-50 border border-slate-200/70 text-slate-500 hover:text-slate-700'
                                                                            }`}
                                                                            style={mActive ? { backgroundColor: theme.color } : undefined}
                                                                        >
                                                                            {m.label}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="rounded-3xl border border-slate-200/70 bg-white shadow-sm overflow-hidden">
                                        <div className="px-5 py-4 border-b border-slate-100 flex items-center gap-3">
                                            <StepBadge n={1} />
                                            <div className="mr-auto">
                                                <h2 className="text-sm font-bold text-slate-900 leading-tight">Process Setup</h2>
                                                <p className="text-[11px] text-slate-400">Tune each process to your liking</p>
                                            </div>
                                            <button
                                                onClick={randomize}
                                                title="Randomize processes"
                                                className="flex items-center gap-1 text-[11px] font-semibold text-slate-600 bg-white border border-slate-300 hover:border-slate-400 px-2.5 py-1.5 rounded-lg transition-all hover:-translate-y-0.5 active:translate-y-0"
                                            >
                                                <span className="w-3.5 h-3.5"><ICONS.shuffle /></span>
                                                Random
                                            </button>
                                            <button
                                                onClick={resetProcesses}
                                                title="Reset demo processes"
                                                className="flex items-center gap-1 text-[11px] font-semibold text-slate-600 bg-white border border-slate-300 hover:border-slate-400 px-2.5 py-1.5 rounded-lg transition-all hover:-translate-y-0.5 active:translate-y-0"
                                            >
                                                <span className="w-3.5 h-3.5"><ICONS.reset /></span>
                                                Reset
                                            </button>
                                        </div>

                                        <div className="p-4 flex flex-col gap-3 max-h-[560px] overflow-y-auto slim-scroll">
                                            {processes.map((p, i) => {
                                                const isActive = currentlyActiveProcessId === p.id;
                                                const hex = COLOR_HEX[i % COLOR_HEX.length];
                                                const tNow = playbackTime;
                                                const res = simulation.results.find(r => r.id === p.id);
                                                let pstate = 'ready';
                                                if (isActive) pstate = 'running';
                                                else if (res && res.at > tNow) pstate = 'waiting';
                                                else if (res && res.endTime <= tNow) pstate = 'done';
                                                const badgeCls = {
                                                    running: '',
                                                    ready: 'bg-amber-50 text-amber-600 border-amber-200',
                                                    done: 'bg-emerald-50 text-emerald-600 border-emerald-200',
                                                    waiting: 'bg-slate-50 text-slate-400 border-slate-200',
                                                }[pstate];
                                                return (
                                                    <div
                                                        key={p.id}
                                                        className={`rounded-2xl border p-4 transition-all duration-300 ${isActive ? '' : 'border-slate-200/70 hover:border-slate-300'}`}
                                                        style={isActive
                                                            ? { borderColor: theme.color, backgroundColor: `${theme.color}0D`, boxShadow: `0 0 0 3px ${theme.glow}22` }
                                                            : undefined}
                                                    >
                                                        <div className="flex items-center gap-2.5">
                                                            <span className="h-3 w-3 rounded-full flex-shrink-0" style={{ backgroundColor: hex }}></span>
                                                            <span className={`text-sm font-bold flex-shrink-0 ${isActive ? 'text-slate-900' : 'text-slate-700'}`}>{p.id}</span>
                                                            <span
                                                                className={`text-[10px] font-medium px-2 py-0.5 rounded-full border ${badgeCls} ml-auto`}
                                                                style={pstate === 'running' ? { backgroundColor: `${theme.color}1A`, color: theme.color, borderColor: `${theme.color}33` } : undefined}
                                                            >
                                                                {pstate}
                                                            </span>
                                                            <button
                                                                onClick={() => removeProcess(i)}
                                                                disabled={processes.length <= 1}
                                                                aria-label={`Remove ${p.id}`}
                                                                className="text-slate-300 hover:text-rose-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors p-1 rounded-lg hover:bg-rose-50"
                                                            >
                                                                <ICONS.trash />
                                                            </button>
                                                        </div>

                                                        <div className={`mt-3 grid gap-2 ${activeAlgo.hasPriority ? 'grid-cols-3' : 'grid-cols-2'}`}>
                                                            <label className="flex flex-col gap-1">
                                                                <span className="text-[9px] font-semibold uppercase tracking-wider text-slate-400">Arrival</span>
                                                                <input
                                                                    type="number"
                                                                    min="0"
                                                                    value={p.at}
                                                                    onChange={(e) => updateProcess(i, 'at', e.target.value)}
                                                                    aria-label={`${p.id} arrival time`}
                                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none focus:border-[color:var(--primary)] focus:ring-2 focus:ring-slate-200 transition-colors"
                                                                />
                                                            </label>
                                                            {activeAlgo.hasPriority && (
                                                                <label className="flex flex-col gap-1">
                                                                    <span className="text-[9px] font-semibold uppercase tracking-wider text-slate-400">Priority</span>
                                                                    <input
                                                                        type="number"
                                                                        min="1"
                                                                        value={p.priority}
                                                                        onChange={(e) => updateProcess(i, 'priority', e.target.value)}
                                                                        aria-label={`${p.id} priority`}
                                                                        className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none focus:border-[color:var(--primary)] focus:ring-2 focus:ring-slate-200 transition-colors"
                                                                    />
                                                                </label>
                                                            )}
                                                            <label className="flex flex-col gap-1">
                                                                <span className="text-[9px] font-semibold uppercase tracking-wider text-slate-400">Burst</span>
                                                                <input
                                                                    type="number"
                                                                    min="1"
                                                                    value={p.bt}
                                                                    onChange={(e) => updateProcess(i, 'bt', e.target.value)}
                                                                    aria-label={`${p.id} burst time`}
                                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none focus:border-[color:var(--primary)] focus:ring-2 focus:ring-slate-200 transition-colors"
                                                                />
                                                            </label>
                                                        </div>

                                                        {/* Burst slider */}
                                                        <div className="mt-3 flex items-center gap-3">
                                                            <span className="text-[9px] font-semibold uppercase tracking-wider text-slate-400 flex-shrink-0">Length</span>
                                                            <input
                                                                type="range"
                                                                min="1"
                                                                max="15"
                                                                value={p.bt}
                                                                onChange={(e) => updateProcess(i, 'bt', e.target.value)}
                                                                aria-label={`${p.id} burst time slider`}
                                                                className="flex-1"
                                                            />
                                                            <span className="text-xs font-mono font-bold flex-shrink-0" style={{ color: hex }}>{p.bt} ms</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}

                                            <button
                                                onClick={addProcess}
                                                className="w-full py-3 rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 text-sm font-semibold hover:border-slate-400 hover:text-slate-700 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5"
                                            >
                                                <span className="w-4 h-4"><ICONS.plus /></span>
                                                Add another process
                                            </button>
                                        </div>
                                    </div>

                                    {/* Quantum */}
                                    <div className={`transition-all duration-500 overflow-hidden ${activeAlgo.hasQuantum ? 'max-h-32 opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <div className="rounded-3xl border border-slate-200/70 bg-white shadow-sm p-4">
                                            <div className="flex items-center justify-between mb-2.5">
                                                <span className="text-[10px] font-semibold uppercase tracking-widest text-slate-400">Time Quantum</span>
                                                <span className="text-xs font-bold font-mono px-2 py-0.5 rounded-lg" style={{ backgroundColor: `${theme.color}1A`, color: theme.color }}>{quantum} ms</span>
                                            </div>
                                            <div className="flex gap-1 p-1 rounded-xl bg-slate-100 border border-slate-200">
                                                {QUANTUM_OPTIONS.map(q => (
                                                    <button
                                                        key={q}
                                                        onClick={() => setQuantum(q)}
                                                        aria-pressed={quantum === q}
                                                        className={`flex-1 py-2 rounded-lg text-xs font-semibold transition-all ${quantum === q ? 'text-white' : 'text-slate-500 hover:text-slate-700'}`}
                                                        style={quantum === q ? { backgroundColor: theme.color } : undefined}
                                                    >
                                                        {q}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* -------- RIGHT: RUN + RESULTS -------- */}
                                <section className="flex flex-col gap-6" aria-label="Simulation stage">
                                    {/* Timeline */}
                                    <div className="rounded-3xl border border-slate-200/70 bg-white shadow-sm p-5 sm:p-6">
                                        <div className="flex items-center gap-3 mb-5">
                                            <StepBadge n={2} />
                                            <div className="mr-auto">
                                                <h2 className="text-sm font-bold text-slate-900 leading-tight">Run the Timeline</h2>
                                                <p className="text-[11px] text-slate-400">Watch the CPU pick processes</p>
                                            </div>
                                            <span className="hidden sm:inline text-[11px] font-mono font-semibold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500 border border-slate-200">
                                                t = {playbackTime} / {totalTime}
                                            </span>
                                        </div>

                                        {/* Player controls */}
                                        <div className="flex items-center gap-3 mb-5 flex-wrap">
                                            <button
                                                onClick={togglePlay}
                                                aria-label={isPlaying ? 'Pause playback' : 'Play playback'}
                                                className="h-12 w-12 flex items-center justify-center rounded-2xl text-white transition-transform hover:scale-105 active:scale-95"
                                                style={{ backgroundColor: theme.color, boxShadow: `0 6px 20px ${theme.glow}` }}
